name: Build
on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build:
    name: Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build tests/Geta.Optimizely.Tags.Tests/Geta.Optimizely.Tags.Tests.csproj --configuration Release

      - name: Test
        run: dotnet test tests/Geta.Optimizely.Tags.Tests/Geta.Optimizely.Tags.Tests.csproj --configuration Release --no-build --filter Category!=Integration --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
