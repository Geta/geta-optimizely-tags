name: Release
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
jobs:
  build:
    name: Release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify commit exists in origin/master
        run: |
          git fetch --no-tags --prune --depth=1 origin +refs/heads/*:refs/remotes/origin/*
          git branch --remote --contains | grep origin/master
      - name: Set VERSION variable from tag
        run: |
          $version = ("${{github.ref_name}}").Remove(0, 1)
          echo "VERSION=$version" >> $env:GITHUB_ENV
      - name: Release
        run: |
          echo "${env:VERSION}"
          dotnet build tests/Geta.Optimizely.Tags.Tests/Geta.Optimizely.Tags.Tests.csproj --configuration Release /p:Version=${{env.VERSION}}
      - name: Test
        run: dotnet test tests/Geta.Optimizely.Tags.Tests/Geta.Optimizely.Tags.Tests.csproj --configuration Release /p:Version=${{env.VERSION}} --no-build --filter Category!=Integration
      - name: Pack
        run: dotnet pack src/Geta.Optimizely.Tags/Geta.Optimizely.Tags.csproj --configuration Release /p:Version=${{env.VERSION}} --no-build --output artifacts
      - name: Push
        run: |
          dotnet nuget push artifacts/Geta.Optimizely.Tags.${{env.VERSION}}.nupkg --source https://nuget.pkg.github.com/Geta/index.json --api-key ${{env.GITHUB_TOKEN}}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Only the Geta.Optimizely.Tags package is attached to the release. Searching the checkout for *.nupkg would also
      # pick up the packages that are checked in to the sandbox submodule.
      - name: Create GitHub Release with the package and auto-generated notes
        run: |
          gh release create ${{ github.ref_name }} artifacts/Geta.Optimizely.Tags.${{env.VERSION}}.nupkg --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
